trainer_kwargs:
  visible_devices: "0,1,2,3"
  accumulate_grad_batches: 32
  max_epochs: 50
  precision: 16-mixed
  #limit_train_batches: 18000
  #limit_val_batches: 4500


data_kwargs:
  data_dir: "/pscratch/sd/r/rmastand/particlemind/data/p8_ee_tt_ecm365_parquetfiles_train"
  num_files: 450
  train_fraction: 0.8
  batch_size_per_gpu: 2
  pad: 14000
  
model_kwargs:
  input_dim: 4 # DON'T CHANGE
  latent_dim: 16
  hidden_dim: 128
  num_heads: 3
  num_blocks: 8
  alpha: 5
  vq_kwargs: 
    num_codes: 512
    beta: 0.9 
    kmeans_init: True
    norm: null
    cb_norm: null
    affine_lr: 0.0
    sync_nu: 2
    replace_freq: 20
    dim: -1 # DON'T CHANGE


optimizer_kwargs: 
  lr: 0.0001
  weight_decay: 0.01

lr_scheduler_kwargs:
  use_scheduler: True
  warmup_frac: 0.025


    