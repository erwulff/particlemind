trainer_kwargs:
  visible_devices: "0"
  accumulate_grad_batches: 128
  max_epochs: 10
  precision: 16-mixed
  #limit_train_batches: 18000
  #limit_val_batches: 4500

loss_type: "mse"

model_kwargs:
  model_type: "mlp"
  latent_dim: 32
  encoder_layers: [512, 512]
  decoder_layers: [512, 512]
  alpha: 5
  shared_weight: 2 
  aug_weight: 0
  vq_kwargs: null

optimizer_kwargs: 
  lr: 0.0001
  weight_decay: 0.001

lr_scheduler_kwargs:
  use_scheduler: True
  warmup_frac: 0.05


    