trainer_kwargs:
  visible_devices: "0"
  accumulate_grad_batches: 32
  max_epochs: 20
  precision: 16-mixed
  #limit_train_batches: 18000
  #limit_val_batches: 4500


model_kwargs:
  latent_dim: 16
  hidden_dim: 128
  num_heads: 2
  num_blocks: 2
  alpha: 5
  beta: 1 # ssl 
  vq_kwargs: 
    num_codes: 128
    beta: 0.9 
    kmeans_init: True
    norm: null
    cb_norm: null
    affine_lr: 0.0
    sync_nu: 2
    replace_freq: 20
    dim: -1 # DON'T CHANGE


optimizer_kwargs: 
  lr: 0.0001
  weight_decay: 0.01

lr_scheduler_kwargs:
  use_scheduler: True
  warmup_frac: 0.025


    