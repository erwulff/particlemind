trainer_kwargs:
  visible_devices: "0"
  accumulate_grad_batches: 256
  max_epochs: 10
  precision: 16-mixed
  #limit_train_batches: 18000
  #limit_val_batches: 4500

loss_type: "mse"

model_kwargs:
  model_type: "mlp"
  latent_dim: 4
  encoder_layers: [256, 256]
  decoder_layers: [256, 256]
  alpha: 5
  shared_weight: 0.0
  aug_weight: 0
  vq_kwargs: null

optimizer_kwargs: 
  lr: 0.0005
  weight_decay: 0.001

lr_scheduler_kwargs:
  use_scheduler: True
  warmup_frac: 0.05


    