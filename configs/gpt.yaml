trainer_kwargs:
  visible_devices: "0"
  accumulate_grad_batches: 32
  max_epochs: 2
  precision: 16
  #limit_train_batches: 4000
  #limit_val_batches: 1000


model_kwargs:
  embedding_dim: 256
  attention_dropout: 0.1
  vocab_size: 514
  max_sequence_len: 8050
  n_GPT_blocks: 2
  n_heads: 4
  verbosity: True
  return_embeddings: True

optimizer_kwargs: 
  lr: 0.0001
  weight_decay: 0.01

lr_scheduler_kwargs:
  use_scheduler: True
  warmup_frac: 0.025


    